[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logicforge-backend"
version = "0.1.0"
description = "Python backend for LogicForge: The Programmer's Brain"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  {name = "LogicForge Team", email = "team@logicforge.dev"}
]

dependencies = [
  "fastapi==0.109.0",
  "uvicorn==0.27.0",
  "pydantic==2.6.0",
  "pydantic-settings==2.1.0",
  "sqlalchemy==2.0.25",
  "python-multipart==0.0.6",
  "python-dotenv==1.0.0",
  "passlib==1.7.4",
  "python-jose==3.3.0",
  "cryptography==41.0.7",
]

[project.optional-dependencies]
dev = [
  "pytest==7.4.4",
  "pytest-asyncio==0.23.2",
  "httpx==0.25.2",
  "black==23.12.1",
  "ruff==0.1.11",
  "mypy==1.7.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
